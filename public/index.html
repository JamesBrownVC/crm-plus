<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM+</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23F25C1F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230B0B0C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#F25C1F"/><circle cx="16" cy="16" r="5" fill="#0B0B0C"/></svg>
        <span>CRM<em>+</em></span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="me-chip" class="me-chip"></div>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <div class="search-wrap">
          <span class="search-icon" id="search-icon"></span>
          <input id="global-search" type="text" placeholder="Search people &amp; companies…  ( / )" autocomplete="off" spellcheck="false">
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="quick-actions" id="quick-actions"></div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="login-root" class="hidden"></div>
  <div id="popover" class="popover hidden" role="tooltip"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
